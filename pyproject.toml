[project]
name = "miobot"
version = "0.1.0"
description = "Async Telegram bot for markdown rendering, media download, and contextual chat replies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "aiosqlite>=0.20.0",
    "fastembed>=0.3.6",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "markdown2>=2.5.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "playwright>=1.45.0",
    "python-telegram-bot>=21.0",
    "requests>=2.31.0",
    "uvicorn>=0.30.0",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
med = [
    "pypdfium2>=4.30.0",
]

[project.scripts]
miobot = "main:main"
miobot-rag = "app.database:cli_main"
miobot-webadmin = "webadmin.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "app/**/*.py",
    "webadmin/**/*.py",
    "webadmin/static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "main.py",
    "app/**/*.py",
    "webadmin/**/*.py",
    "webadmin/static/**/*",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]